name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
        working-directory: mcp-server
      - run: npm run check
        working-directory: mcp-server
      - run: npm test
        working-directory: mcp-server
      - name: verify repository-id derivation
        run: |
          test "$(printf '%s' 'github.com/octo/api' | shasum -a 256 | cut -c1-20)" = "540b016418280e51939c"
          sh save-point/scripts/derive-repo-id.sh .
      - name: verify remote normalization fixtures
        run: |
          for url in 'https://GitHub.com/Octo/API.git' 'git@github.com:octo/api.git' 'ssh://git@github.com:2222/octo/api'; do
            d=$(mktemp -d)
            git -C "$d" init -q
            git -C "$d" remote add origin "$url"
            canonical=$(sh save-point/scripts/derive-repo-id.sh "$d" | head -1)
            id=$(sh save-point/scripts/derive-repo-id.sh "$d" | tail -1)
            test "$canonical" = "github.com/octo/api" || { echo "FAIL canonical for $url: $canonical"; exit 1; }
            test "$id" = "540b016418280e51939c" || { echo "FAIL id for $url: $id"; exit 1; }
          done
          d=$(mktemp -d)
          git -C "$d" init -q
          sh save-point/scripts/derive-repo-id.sh "$d" | head -1 | grep -q '^/' || { echo "FAIL no-remote case"; exit 1; }
      - name: verify install script
        run: HOME=$(mktemp -d) sh -c 'mkdir -p "$HOME/.claude" && ./install.sh && test -f "$HOME/.claude/skills/save-point/SKILL.md" && test -x "$HOME/.claude/skills/save-point/scripts/check-due.sh" && test ! -d "$HOME/.claude/skills/save-point/features"'
      - name: verify scheduling and hook scripts
        run: |
          test "$(sh save-point/scripts/reschedule.sh 2 solid false 3 | head -1)" = "3"
          test "$(sh save-point/scripts/reschedule.sh 2 solid false 5 | head -1)" = "2"
          test "$(sh save-point/scripts/reschedule.sh 1 failed true 3 | head -1)" = "0"
          test "$(sh save-point/scripts/reschedule.sh 2 superseded false 3 | head -1)" = "0"
          test "$(printf '> abc\n' | sh save-point/scripts/hash-answer.sh)" = "$(printf '%s' abc | shasum -a 256 | cut -d' ' -f1)"
          S=$(mktemp -d); SAVE_POINT_HOME=$S sh save-point/scripts/check-due.sh; test -z "$(SAVE_POINT_HOME=$S sh save-point/scripts/check-due.sh)"
          mkdir -p "$S/repositories/x"
          printf -- '---\nrepository_name: api\nnext_due_at: 2020-01-01T00:00:00Z\n---\n' > "$S/repositories/x/recall.md"
          SAVE_POINT_HOME=$S sh save-point/scripts/check-due.sh | grep -q additionalContext
