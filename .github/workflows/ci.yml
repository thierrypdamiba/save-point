name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  mcp-node20:
    # package.json says node >=20, so test the oldest supported Node too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
        working-directory: mcp-server
      - run: npm run check
        working-directory: mcp-server
      - run: npm test
        working-directory: mcp-server
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: verify versions agree
        run: |
          sh scripts/check-versions.sh
          d=$(mktemp -d)
          cp -R .claude-plugin mcp-server "$d"/ 2>/dev/null || true
          sed -i 's/"version": "[^"]*"/"version": "9.9.9"/' "$d/.claude-plugin/plugin.json"
          if sh scripts/check-versions.sh "$d" 2>/dev/null; then echo "FAIL mismatch not caught"; exit 1; fi
      - run: npm ci
        working-directory: mcp-server
      - run: npm run check
        working-directory: mcp-server
      - run: npm test
        working-directory: mcp-server
      - name: verify repository-id derivation
        run: sh scripts/test-repo-id.sh
      - name: verify no network use
        run: |
          # The tool itself must make no network calls. install.sh is excluded: it runs git clone when piped.
          # The only allowed match is the ssh:// URL used as test data in scripts/test-repo-id.sh.
          if grep -nwE 'curl|wget|nc|ncat|telnet|scp|ssh|sftp|ftp|rsync' save-point/scripts/*.sh scripts/*.sh hooks/* | grep -v "^scripts/test-repo-id.sh:[0-9]*:for url in .*'ssh://git@github.com:2222/octo/api'; do$"; then echo "FAIL network tool in a script"; exit 1; fi
          if grep -nE 'node:(net|http|https|http2|dgram|tls|dns|child_process)|\bfetch\(|XMLHttpRequest|WebSocket' mcp-server/src/*.ts; then echo "FAIL network or process use in the MCP server"; exit 1; fi
          # The check must be able to fail.
          d=$(mktemp -d); printf 'curl example.com\n' > "$d/x.sh"
          if ! grep -qwE 'curl|wget|nc' "$d/x.sh"; then echo "FAIL network check cannot detect curl"; exit 1; fi
          grep -q 'docs/security-and-privacy.md' SECURITY.md
      - name: verify shell hygiene
        run: |
          # Every shell script in the repository must parse, and shellcheck must find no warnings.
          files=$(git ls-files '*.sh')
          test -n "$files"
          # eval/ assert scripts use the string test \> and are only syntax checked here (see ROADMAP.md item 7).
          lint=$(git ls-files '*.sh' | grep -v '^eval/')
          for f in $files; do sh -n "$f" || { echo "FAIL syntax: $f"; exit 1; }; done
          # Every tracked file with a shell shebang must end in .sh, so the list above is complete.
          for f in $(git ls-files); do
            case "$f" in *.sh) continue ;; esac
            if head -c 2 "$f" 2>/dev/null | grep -q '^#!' && head -1 "$f" | grep -qE 'sh( |$)'; then
              case "$f" in install.sh) ;; *) echo "FAIL shell script without .sh: $f"; exit 1 ;; esac
            fi
          done
          sh -n install.sh
          command -v shellcheck >/dev/null || { echo "FAIL shellcheck missing on the runner"; exit 1; }
          shellcheck -s sh -S warning install.sh $lint
          # The check must be able to fail.
          d=$(mktemp -d); printf '#!/bin/sh\nrm -rf $UNSET/\n[ $x = 1 ] && echo "a b"\nfor f in $(ls); do echo $f; done\n' > "$d/bad.sh"
          if shellcheck -s sh -S warning "$d/bad.sh" >/dev/null; then echo "FAIL shellcheck cannot detect a defect"; exit 1; fi
      - name: verify installer, hook merge and uninstall
        run: |
          sh -n install.sh scripts/test-install.sh
          sh scripts/test-install.sh
      - name: verify quickstart doc matches the tool
        run: |
          q=docs/quickstart.md
          test -f "$q"
          # Every installer flag and message the doc names must exist in install.sh.
          for s in '--uninstall' '--ref' 'no host directories found' 'unknown host' 'could not update' 'python3 not found'; do
            grep -q -e "$s" install.sh || { echo "FAIL install.sh lacks: $s"; exit 1; }
          done
          for s in '--uninstall' '--ref' 'no host directories found' 'unknown host' 'could not update' 'python3'; do
            grep -q -e "$s" "$q" || { echo "FAIL quickstart lacks: $s"; exit 1; }
          done
          # The subcommand of every backticked /save-point command in the doc must appear in the README.
          grep -o '`/save-point [a-z]*' "$q" | cut -d' ' -f2 | sort -u | while read -r c; do
            grep -qw -e "$c" README.md || { echo "FAIL command not in README: $c"; exit 1; }
          done
          grep -q 'docs/quickstart.md' README.md
      - name: verify team guide matches the tool
        run: |
          t=docs/teams.md
          test -f "$t"
          # Every profile setting the guide names must exist in the profile template.
          for s in interruption_style daily_limit minimum_gap questions_per_interruption default_snooze question_stats cross_repo_recall recall_intervals repetition_mode persona setup_status; do
            grep -q -e "$s" "$t" || { echo "FAIL teams.md lacks: $s"; exit 1; }
            grep -q "^$s:" save-point/assets/profile.md || { echo "FAIL profile template lacks: $s"; exit 1; }
          done
          # Every flag and command the guide names must exist.
          grep -q -e '--uninstall' install.sh && grep -q -e '--ref' install.sh
          grep -o '`/save-point [a-z]*' "$t" | cut -d' ' -f2 | sort -u | while read -r c; do
            grep -qw -e "$c" README.md || { echo "FAIL command not in README: $c"; exit 1; }
          done
          grep -q 'docs/teams.md' README.md
      - name: verify eval results recorder
        run: sh scripts/test-record-results.sh
      - name: verify state format doc matches the templates
        run: |
          f=docs/state-formats.md
          test -f "$f"
          # Every field in every template must be named in the doc.
          for t in profile scheduler recall savepoint; do
            for k in $(grep -oE '^(- )?[a-z_0-9]+:' "save-point/assets/$t.md" | tr -d '\- :' | sort -u); do
              grep -q -e "\`$k\`" "$f" || { echo "FAIL $f lacks $k from $t.md"; exit 1; }
            done
          done
          # The check must be able to fail.
          grep -q 'no_such_field_xyz' "$f" && { echo "FAIL check cannot detect a missing field"; exit 1; }
          grep -q 'docs/state-formats.md' README.md
      - name: verify install script
        run: HOME=$(mktemp -d) sh -c 'mkdir -p "$HOME/.claude" && ./install.sh && test -f "$HOME/.claude/skills/save-point/SKILL.md" && test -x "$HOME/.claude/skills/save-point/scripts/check-due.sh" && test -x "$HOME/.claude/skills/save-point/scripts/hash-source.sh" && test ! -d "$HOME/.claude/skills/save-point/features"'
      - name: verify scheduling and hook scripts
        run: sh scripts/test-reschedule.sh
      - name: verify persona check script
        run: sh scripts/test-persona.sh
      - name: verify stats script
        run: sh scripts/test-stats.sh
      - name: verify answer hash script
        run: sh scripts/test-hash-answer.sh
      - name: verify source hash and snapshot script
        run: sh scripts/test-hash-source.sh
      - name: verify Markdown links
        run: sh scripts/test-check-links.sh
